# 協力者募集ページの送信テンプレ（スマホから編集しやすいよう YAML 管理）
# 編集例: GitHub アプリでこのファイルを直す → main に push → Cloudflare が再デプロイ
# または Cursor iOS で「recruit-templates.yaml の ○○テンプレを修正」とエージェントに依頼
#
templates:
  - id: character-tips
    label: 各キャラの使い方のコツ
    body: |
      【各キャラの使い方のコツ】
      キャラ名:

      ■ 立ち回りのコツ（箇条書き可）
      -
      -

      ■ スキル・タイミングで効いたこと
      -

      ■ 苦手な相手・注意点
      -

  - id: deck-record
    label: 使っているデッキの対戦数・勝利数・立ち回り
    body: |
      【使っているデッキの対戦数・勝利数・立ち回り】
      デッキ名（任意）:
      編成: キャラA / キャラB / キャラC

      対戦数:
      勝利数:

      立ち回り:


      執筆者（ニックネーム・任意）:

  - id: typo
    label: 誤字脱字の指摘
    body: |
      【誤字脱字の指摘】
      ページURL（またはページ名）:

      ■ 該当箇所（そのままコピー可）
      「」

      ■ 修正案
      「」

      ■ 補足（任意）
      スクリーンショットの有無:
      連絡用ニックネーム（任意）:

  - id: clarity
    label: 分かりにくいページの改善案
    body: |
      【分かりにくいページの改善案】
      ページURL（またはページ名）:

      ■ 何が分かりにくかったか
      -

      ■ どうすると分かりやすいか（具体案）
      -

      ■ 想定読者（任意・例: 初心者 / ランクマ勢）
      -

      連絡用ニックネーム（任意）:

  - id: design
    label: 構成・デザインのアイデア
    body: |
      【構成・デザインのアイデア】
      対象（サイト全体 / 特定ページ名）:

      ■ いまの印象（任意）
      -

      ■ 提案したいこと（レイアウト・色・見出し・導線など）
      -

      ■ 参考サイト・参考画像（任意）
      -

      連絡用ニックネーム（任意）:

  - id: usability
    label: 使い勝手のフィードバック
    body: |
      【使い勝手のフィードバック】
      利用環境（例: iPhone Safari / Windows Chrome）:

      ■ やりたかった操作
      -

      ■ 実際に起きたこと（困った点）
      -

      ■ あると助かる機能・改善希望
      -

      ■ 重要度（任意: 高 / 中 / 低）
      -

      連絡用ニックネーム（任意）: